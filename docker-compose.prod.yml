services:
  # ============================================================================
  # 1. Base de données PostgreSQL Transactionnelle (Grand Livre Immuable)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: roe_prod_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-roe_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roe_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-roe_bolet_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-roe_admin} -d ${POSTGRES_DB:-roe_bolet_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - roe_internal_net

  # ============================================================================
  # 2. Cache & Pub/Sub Redis (Garantie de Verrouillage & Performance)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: roe_prod_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-roe_redis_secret_2026}", "--appendonly", "yes"]
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-roe_redis_secret_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - roe_internal_net

  # ============================================================================
  # 3. Backend NestJS (Moteur Transactionnel & Sécurité)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roe_prod_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-roe_admin}:${POSTGRES_PASSWORD:-roe_secure_password_2026}@postgres:5432/${POSTGRES_DB:-roe_bolet_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-roe_redis_secret_2026}
      JWT_SECRET: ${JWT_SECRET:-roe_production_jwt_secret_high_entropy_2026}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400}
      HMAC_TICKET_SECRET: ${HMAC_TICKET_SECRET:-roe_ticket_qr_secret_key_prod_2026}
      DRAW_VALIDATION_SECRET: ${DRAW_VALIDATION_SECRET:-roe_draw_audit_validation_secret_prod_2026}
      CANCELLATION_WINDOW_MINUTES: ${CANCELLATION_WINDOW_MINUTES:-5}
      TICKET_EXPIRATION_DAYS: ${TICKET_EXPIRATION_DAYS:-90}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - roe_internal_net

  # ============================================================================
  # 4. Frontend Next.js (Tableau de Bord Administratif)
  # ============================================================================
  admin-web:
    build:
      context: ./admin-web
      dockerfile: Dockerfile
    container_name: roe_prod_admin_web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    networks:
      - roe_internal_net

  # ============================================================================
  # 5. Reverse Proxy Nginx (SSL/TLS, Rate Limiting & WebSockets)
  # ============================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: roe_prod_nginx
    restart: unless-stopped
    depends_on:
      - backend
      - admin-web
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_prod_logs:/var/log/nginx
    networks:
      - roe_internal_net

# ==============================================================================
# Volumes & Réseaux Isolés
# ==============================================================================
volumes:
  postgres_prod_data:
    name: roe_prod_postgres_data
  redis_prod_data:
    name: roe_prod_redis_data
  nginx_prod_logs:
    name: roe_prod_nginx_logs

networks:
  roe_internal_net:
    name: roe_prod_network
    driver: bridge
